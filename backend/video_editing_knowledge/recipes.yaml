# Style recipes: editing craft as numbers (schema: recipes.schema.json, checked by tests/unit/test_recipes.py).
# shot_len: average shot length range in seconds · hook: what the first 3 s must do · cut_on: beat|speech|action|mixed
# transitions: allowed names (FFmpeg xfade) · look: colour preset / LUT name · captions: off|social|premium|minimal
# zoom_per_min: punch-ins per minute · speed_ramps: count · bpm: music tempo range · duck_db: music under voice
# aspect · duration: default seconds · lufs: loudness target · genre: the genres.yaml type it refines · avoid: rules

recipes:
