  - id: tutorial
    name: Tutorial
    prompt: ['tutorial', 'how to', 'kaise kare', 'sikho', 'step by step']
    footage: {speech: high}
    skills: [jump_cut_talking, word_safe_cuts, social_captions, clean_voice, hard_cuts_default]
