  - id: event
    name: Event
    prompt: ['event', 'conference', 'launch', 'function', 'program']
    footage: {}
    skills: [story_arc, reaction_priority, natural_sound, strong_ending, music_bed]
    structure: arrival → highlights → peak → goodbye
