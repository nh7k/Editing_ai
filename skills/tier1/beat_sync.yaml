id: beat_sync
seed: 94
category: audio
name: Beat sync
name_hi: Beat par cut
description: Move every cut onto the nearest music beat (by at most max_shift s); one long shot is cut on every Nth beat.
params:
  every:
    type: integer
    default: 1
    min: 1
    max: 8
    extract: nth
    desc: every Nth beat
  max_shift:
    type: number
    default: 0.4
    min: 0.05
    max: 1.0
    unit: s
    desc: how far a cut may move
time_modes:
- whole
builder: audio.beat_sync
graph: analysis (librosa beats) → segment out points
media3:
