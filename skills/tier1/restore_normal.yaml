# added for the "yaha screen white kar do nomal jasia tha" failure (docs/INTENT_FAILURE_REVIEW.md)
id: restore_normal
seed: 106
category: stylize
name: Back to normal
name_hi: Pehle jaisa karo
description: Take the effects off a part of the video (or all of it) so it looks like the original again. Colour,
  zoom / motion, style effects and graphics / stickers; text and cuts stay. A colour grade on the whole video
  stays when only a part is restored (it is said back).
params:
  what:
    type: choice
    default: all
    choices:
    - all
    - color
    - motion
    - style
    - overlays
    desc: which kind of effect to take off
time_modes:
- whole
- segment
- between_times
builder: restore.restore_normal
graph: removes plan effects / graphics / stickers in the window (no filter of its own)
media3:
  status: mapped
  how: drop the effects of the EditedMediaItems in the window — NOT TESTED
stage: effect
conflicts: []
cost: cheap
licence: own code
changes_duration: false
needs: []
