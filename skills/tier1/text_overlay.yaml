id: text_overlay
seed: 58
category: text
name: Text on screen
name_hi: Yahan ye likho
description: Static text on the screen at a position, for the whole video or a time window.
params:
  text:
    type: text
    extract: quoted_text
    desc: the words (in quotes)
    required: true
  position:
    type: choice
    choices:
    - bottom
    - center
    - top
    - top_right
    - bottom_right
    - bottom_left
    - top_left
    default: center
    extract: position
    desc: where
  size:
    type: integer
    default: 64
    min: 20
    max: 200
    extract: text_size
    desc: size
  color:
    type: color
    extract: color
    desc: colour
  box:
    type: bool
    default: false
    desc: dark box behind
time_modes:
- whole
- between_times
- segment
- at_time
builder: text.text_overlay
