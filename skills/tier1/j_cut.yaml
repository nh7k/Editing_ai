id: j_cut
seed: 13
category: cutting
name: J-cut (next sound starts early)
name_hi: Agle clip ki awaaz pehle
description: At a cut, the next shot's sound starts lead_sec before its picture (the viewer hears it coming). Needs that much sound before the next shot's in-point.
params:
  lead_sec: {type: number, default: 0.5, min: 0.1, max: 3, unit: s, extract: seconds, desc: how early the sound starts}
  cut: {type: integer, min: 1, max: 500, extract: cut_number, desc: which cut (default every cut)}
time_modes: [whole]
builder: cutting.j_cut
graph: the joined sound with a window replaced by the next source's audio (atrim + adelay + amix)
media3: {status: server_only, reason: "Media3 Transformer ties a clip's audio to its video; split audio needs a separate audio sequence (designed, NOT TESTED)"}
stage: audio
conflicts: [crossfade]
cost: cheap
licence: own code; FFmpeg atrim/adelay/amix (server process)
changes_duration: false
needs: [two_clips]
variant_axes:
  lead: [0.25s, 0.5s, 1s]
  where: [every_cut, one_cut]
synonyms:
  en: [j cut, j-cut, sound first, audio leads, hear the next clip first, audio before picture, pre-lap]
  hinglish: [awaaz pehle aaye, agle clip ki awaaz pehle, aawaz pehle shuru, pehle sunai de phir dikhe, j cut lagao, sound pehle, agla audio pehle]
  hi: [आवाज़ पहले आए, अगले क्लिप की आवाज़ पहले, जे कट]
  slang: [awaaz se entry, audio start early, pehle awaaz sunai]
  typos: [jcut, j cutt, awaz pehle]
negations: [j cut mat lagao, awaaz saath me rakho]
examples:
  - {prompt: "add a j cut", lang: en}
  - {prompt: "let the next clip's audio start 1 second early", lang: en, params: {lead_sec: 1}}
  - {prompt: "अगले क्लिप की आवाज़ पहले आए", lang: hi}
  - {prompt: "agle clip ki awaaz pehle aaye", lang: hinglish}
  - {prompt: "j cut lagao aadha second", lang: hinglish, params: {lead_sec: 0.5}}
  - {prompt: "jcut pls", lang: typo}
  - {prompt: "pehle awaaz sunai de phir video aaye", lang: vague}
  - {prompt: "j cut lagao aur music kam karo", lang: multi, also: [volume]}
test: {check: audio_leads, media: default, params: {lead_sec: 0.6}, setup: [{id: delete_segment, params: {start: 6.0, end: 7.0}}],
       note: the second shot must start inside its clip (1 s in) so there is sound before its cut}
