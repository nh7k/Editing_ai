id: photo_montage
seed: 111
category: motion
name: Photo edit
name_hi: Photos se video
description: Turn the project's photos into an edit — every photo gives a wide shot, a medium and two close-ups on its
  most detailed areas; the shots are cut on the song's beat (every beat where it is loud, every 2nd where calm), each
  with its own camera move, beat punches / flashes / shake, a colour look and a fade. The photos are framed and
  animated; nothing new is generated into them.
params:
  seconds:
    type: number
    default: 12
    min: 4
    max: 60
    unit: s
    extract: seconds
    desc: how long the edit is
  beats_per_shot:
    type: integer
    default: 2
    min: 1
    max: 8
    desc: beats per shot (1 = a cut on every beat)
  look:
    type: choice
    choices: [cinematic, moody_blue, arctic, teal_orange, none]
    default: cinematic
    desc: colour look
  move:
    type: number
    default: 0.18
    min: 0.05
    max: 0.4
    desc: how far the camera moves
  intensity:
    type: choice
    choices: [low, medium, high]
    default: medium
    extract: magnitude_word
    desc: how hard the beat hits are
time_modes:
- whole
builder: photos.photo_montage
graph: photo stills (cutmind/photos.py) → beat-length shots in turn → keyframed scale/translate per shot, colour preset,
  vignette, flash, fade out
media3:
  status: server_only
  how: the server builds the shots and moves; the phone path is NOT TESTED
stage: structure
conflicts: []
cost: medium
licence: own code; Pillow (HPND) for the photos; librosa (ISC) beats; FFmpeg filters
changes_duration: true
needs: []
