time_modes: [whole]
builder: cutting.hook_first
graph: analysis → a first segment from the best window
media3: {status: mapped, how: "server picks the moment; the phone inserts an EditedMediaItem at the start"}
stage: structure
conflicts: []
cost: medium
licence: own code
changes_duration: true
needs: [analysis]
variant_axes:
  mode: [teaser, move]
  length: [1s, 2s, 3s]
synonyms:
  en: [add hook, hook first, start with the best part, strong opening, open with the highlight, grab attention at the start, best moment first]
  hinglish: [hook lagao, shuru me best part, intro strong karo, best part pehle, shuruat dhamakedar, pehle best wala dikhao, shuru me dhamaka]
  hi: [शुरू में सबसे अच्छा हिस्सा, हुक लगाओ, शुरुआत दमदार]
