  - {prompt: "best part pehle", lang: hinglish}
  - {prompt: "intro strong karo hook laga ke", lang: hinglish}
  - {prompt: "hok at start", lang: typo}
  - {prompt: "shuru me kuch dhamakedar chahiye", lang: vague}
  - {prompt: "hook lagao, 20 sec ka karo aur captions", lang: multi, also: [fit_to_duration, auto_captions]}
test: {check: hook_starts, params: {hook_len: 1.5}}
