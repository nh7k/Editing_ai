id: beat_edit
seed: 110
category: audio
name: Beat edit
name_hi: Gaane ki beat pe edit
description: Edit the whole video on the song's beat — cuts moved onto beats, zoom punches whose density follows the
  song's energy (calm every 4th beat, loud every beat), the drop with the strongest punch, a flash and a shake.
params:
  intensity:
    type: enum
    values: [low, medium, high]
    default: medium
    extract: magnitude_word
    desc: how hard the hits are
  cuts:
    type: boolean
    default: true
    desc: also move the cuts onto the beats
time_modes:
- whole
builder: beat.beat_edit
graph: song analysis (librosa beats + energy, numpy kick band) → beatmap hits → pulse / flash / beat_shake times
media3:
  status: server_only
  how: the server computes the hit times; the phone path is NOT TESTED
stage: audio
conflicts: []
cost: medium
licence: own code; librosa (ISC) for beats; FFmpeg filters
changes_duration: false
needs: []
variant_axes:
  intensity:
  - low
  - medium
  - high
