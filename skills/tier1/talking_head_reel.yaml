id: talking_head_reel
seed: 111
category: text
name: Talking-head reel
name_hi: Jo bolo wo screen pe
description: The editorial talking-head edit for vlogs / YouTube / reels — captions that light up word by word as they
  are said, the layout changing with every sentence (full frame, a card on cream paper, the shot on top with the words
  below), the strongest spoken words as big keyword cards, an optional @handle and a "COMMENT X" card when the speaker
  asks for comments.
params:
  handle:
    type: string
    default: null
    extract: handle
    desc: the @handle shown in the corner
  layouts:
    type: bool
    default: true
    desc: change the layout with the sentences
  keywords:
    type: bool
    default: true
    desc: big keyword cards from the speech
  cta:
    type: bool
    default: true
    desc: a COMMENT card when the speaker asks for comments
time_modes:
- whole
builder: speech.talking_head_reel
graph: transcript words (faster-whisper) → sentences / keywords / CTA → split + layout effects + karaoke captions + titles
media3:
  status: server_only
  how: the server renders it; the phone path is NOT TESTED
stage: text
conflicts: []
cost: medium
licence: own code; faster-whisper (MIT) for the words; FFmpeg pad / drawbox / libass
