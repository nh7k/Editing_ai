id: shape_highlight
seed: 73
category: stylize
name: Highlight shape
name_hi: Circle / arrow lagao
description: A box, ring or arrow (own drawing) pointing at an area for a while.
params:
  shape:
    type: choice
    choices:
    - box
    - ring
    - arrow
    default: ring
    desc: shape
  region:
    type: choice
    choices:
    - face
    - center
    - top
    - bottom
    - left
    - right
    - top_left
    - top_right
    - bottom_left
    - bottom_right
    default: center
    extract: region
    desc: where
  color:
    type: color
    default: '#FFD60A'
    extract: color
    desc: colour
  angle:
    type: number
    default: 0
    min: -180
    max: 180
    desc: arrow direction (degrees)
