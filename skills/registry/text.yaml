skills:
- id: captions
  tier: 1
  category: text
  name: Auto captions
  description: Subtitles of what is said, word-timed, 2-3 words per line, inside the app safe zone. Hindi speech → Hinglish words.
  synonyms:
    en: [captions, subtitles, auto captions, add subtitles]
    hi: [कैप्शन, सबटाइटल]
    hinglish: [captions laga do, subtitle daal do, jo bol raha uska text]
    slang: [hormozi captions, reels captions]
    typos: [captins, captons, subtitels]
  params:
    words: {type: integer, default: 3, min: 1, max: 8}
  time_modes: [whole]
  impl: {kind: intent, ref: add captions}
  stage: text
  conflicts: []
  cost: medium
  media3: "OverlayEffect + TextOverlay per caption (times from the server plan) — NOT TESTED"
  licence: own code (ASS via libass); words from faster-whisper (MIT) / Vosk Hindi (Apache-2.0)
  preview: same at 360p
  examples: [add captions, captions laga do, कैप्शन लगा दो, captins lagao, subtitles in 2 words]
  status: tested
  test: tests/integration/test_skill_renders.py
- id: karaoke_captions
  tier: 2
  category: text
  name: Karaoke captions (word highlight)
  description: Each word lights up as it is spoken.
  synonyms:
    en: [karaoke captions, word highlight, highlight the spoken word]
    hinglish: [jo word bole wo highlight ho, karaoke wale captions]
    typos: [karoke]
  params: {}
  time_modes: [whole]
  impl: {kind: intent, ref: karaoke captions, fields: [text_animation]}
  stage: text
  conflicts: []
  cost: medium
  media3: "TextOverlay re-styled per word — NOT TESTED"
  licence: own code (ASS \k tags)
  preview: same at 360p
  examples: [karaoke captions, highlight each word, jo word bole wo highlight ho, karoke subtitles, spoken word in yellow]
  status: tested
  test: tests/integration/test_skill_renders.py
- id: title_text
