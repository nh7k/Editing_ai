skills:
- id: target_duration
  tier: 1
  category: structure
  name: Make it N seconds
  description: Cuts the edit to a length (best moments kept).
  synonyms:
    en: [seconds long, duration, make it 30 seconds, trim to]
    hi: [सेकंड का बनाओ]
    hinglish: [30 sec ka video, 15 second ki reel, das second ka]
    typos: [secnd, secs]
  params:
    seconds: {type: number, default: 30, min: 3, max: 600}
  time_modes: [whole]
  impl: {kind: intent, ref: "{seconds} second ka video"}
  stage: structure
  conflicts: []
  cost: cheap
  media3: "server plans the cut — n/a"
  licence: own code
  preview: same
  examples: [make it 15 seconds, 30 sec ka video, das second ki reel, वीडियो को 30 सेकंड का बना दो, trim to 20 secs]
  status: tested
  test: tests/integration/test_skill_renders.py
