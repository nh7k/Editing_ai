skills:
- id: crossfade
  tier: 1
  category: transition
  name: Crossfade / dissolve
  description: One shot melts into the next.
  synonyms:
    en: [crossfade, dissolve, smooth transition, blend]
    hi: [धीरे से बदलो, स्मूथ ट्रांजिशन]
    hinglish: [smooth karo, crossfade lagao, dheere se badle, mix ho ke badle]
    slang: [soft cuts]
    typos: [crosfade, cross fade, disolve]
  params:
    duration: {type: number, default: 0.5, min: 0.1, max: 2.0}
  time_modes: [whole, segment]
  impl: {kind: transition, ref: crossfade}
  stage: transition
  conflicts: [hard_cuts]
  cost: cheap
  media3: "no built-in transition: Composition with an alpha GlEffect on overlapping sequences — NOT TESTED"
  licence: own code (FFmpeg xfade=fade)
  preview: same at 360p
  examples: [add crossfade transitions, thoda smooth karo, dissolve between clips, crosfade lagao, स्मूथ ट्रांजिशन]
  status: tested
  test: tests/integration/test_skill_renders.py
