skills:
- id: music
  tier: 1
  category: audio
  name: Background music (mood)
  description: Adds a song from the library (or the user's song) by mood.
  synonyms:
    en: [add music, background music, song]
    hi: [गाना लगाओ, म्यूज़िक]
    hinglish: [gaana lagao, music daal do, peeche gaana]
    slang: [bgm daalo, banger song]
    typos: [musik, msuic]
  params:
    mood: {type: enum, default: upbeat, choices: [upbeat, calm, sad, romantic, party, emotional, chill]}
  time_modes: [whole]
  impl: {kind: intent, ref: "{mood} music lagao", fields: [music]}
  stage: audio
  conflicts: [no_music]
  cost: cheap
  media3: "second audio sequence in the Composition — NOT TESTED"
  licence: library generated locally (cutmind.media_gen); user uploads are the user's
  preview: same
  examples: [add upbeat music, calm music lagao, gaana lagao, bgm daalo, romantic song peeche]
  status: tested
  test: tests/integration/test_skill_renders.py
