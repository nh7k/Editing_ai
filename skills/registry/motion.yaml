- id: slow_motion
  tier: 1
  category: motion
  name: Slow motion
  description: Plays the footage slower (whole edit, a part, or only the end).
  synonyms:
    en: [slow motion, slowmo, slow mo]
    hi: [स्लो मोशन, धीमा करो]
    hinglish: [slow motion karo, slowmo daal do, dheere dheere chalao, end me slow motion]
    slang: [cinematic slowmo]
    typos: [slow moshan, slomo, slow motin]
  params:
    speed: {type: number, default: 0.5, min: 0.25, max: 0.9}
  time_modes: [whole, between_times, at_moment]
  impl: {kind: intent, ref: slow motion}
  stage: time
  conflicts: [speed_up]
  cost: cheap
  media3: "EditedMediaItem.setSpeed / SpeedProvider — NOT TESTED"
  licence: own code (FFmpeg setpts + atempo)
  preview: same at 360p
  examples: [slow motion please, slow moshan daal do, end me slow motion, स्लो मोशन, last shot slowmo]
  status: tested
  test: tests/integration/test_skill_renders.py
- id: speed_ramp
  tier: 2
  category: motion
  name: Speed ramp
  description: Fast → slow → fast inside one shot (velocity edit).
  synonyms:
    en: [speed ramp, velocity, ramp]
    hinglish: [speed ramp karo, velocity edit, tez phir dheere]
    slang: [velocity edit, smooth ramp]
    typos: [sped ramp]
  params:
    strength: {type: number, default: 2.0, min: 1.25, max: 3.0}
  time_modes: [segment, between_times, at_moment]
  impl: {kind: effect, ref: speed_ramp, strength_param: strength}
  stage: time
  conflicts: [reverse]
  cost: medium
  media3: "SpeedProvider with a curve — NOT TESTED"
  licence: own code (FFmpeg setpts expression)
  preview: same at 360p
  examples: [add a speed ramp, velocity edit bana do, speed ramp on the jump, tez phir dheere karo, ramp at 5s]
  status: tested
  test: tests/integration/test_skill_renders.py
- id: speed_up
  tier: 1
  category: motion
  name: Speed up / faster pace
  description: Faster cuts (shorter shots); with "2x" the footage itself plays faster.
  synonyms:
    en: [faster, speed up, quicker, more pace]
    hi: [तेज़ करो, जल्दी]
    hinglish: [thoda fast karo, tez karo, jaldi jaldi, speed badhao]
    slang: [fast paced, hype pace]
    typos: [fastr, fasst]
  params:
    amount: {type: number, default: 0.67, min: 0.25, max: 0.95, desc: "shot length multiplier"}
  time_modes: [whole]
  impl: {kind: intent, ref: thoda fast karo}
  stage: structure
  conflicts: [slow_motion]
  cost: cheap
  media3: "server plans the cut; the phone only plays segments — n/a"
  licence: own code
  preview: same
  examples: [thoda fast karo, make it faster, tez karo, speed badhao, bahut slow hai fast karo]
  status: tested
  test: tests/integration/test_skill_renders.py
- id: reverse
  tier: 2
  category: motion
