skills:
- id: zoom_in
  tier: 1
  category: motion
  name: Slow zoom in (Ken Burns)
  description: A smooth push-in on the picture over the chosen time.
  synonyms:
    en: [zoom in, slow zoom, push in, ken burns, zoom effect]
    hi: [ज़ूम करो, ज़ूम इन, पास से दिखाओ]
    hinglish: [zoom karo, zoom laga do, zoom in karo, paas se dikhao, dheere dheere zoom]
    slang: [cinematic zoom, smooth zoom]
    typos: [zom in, zoomin, zoon]
  params:
    strength: {type: number, default: 1.0, min: 0.3, max: 3.0, desc: "how far it pushes in"}
  time_modes: [whole, segment, between_times, intermittent, at_moment, on_words]
  impl: {kind: effect, ref: zoom, strength_param: strength}
  stage: geometry
  conflicts: [zoom_out]
  cost: cheap
  media3: "MatrixTransformation (per-frame scale from the same easing curve) — NOT TESTED"
  licence: own code (FFmpeg zoompan/scale/crop filters)
  preview: same filter at 360p
  examples: [add a slow zoom, zoom karo, starting ke 3 sec zoom, ज़ूम करो, ken burns effect on the photos, zom in plz]
  status: tested
  test: tests/integration/test_skill_renders.py
- id: punch_in
