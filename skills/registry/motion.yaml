    hinglish: [punch in karo, jhatke se zoom, zoom punch, beat pe zoom]
    slang: [hormozi zoom, zoom on the beat]
    typos: [panch in, punchin]
  params:
    strength: {type: number, default: 1.6, min: 0.5, max: 3.0}
  time_modes: [at_beats, at_moment, on_words, intermittent]
  impl: {kind: effect, ref: punch, strength_param: strength}
  stage: geometry
  conflicts: []
  cost: cheap
  media3: "MatrixTransformation keyframed scale spike — NOT TESTED"
  licence: own code (FFmpeg)
  preview: same at 360p
  examples: [punch in on every beat, beat pe zoom karo, zoom hit at 4s, important words pe zoom, jhatke se zoom karo]
  status: tested
  test: tests/integration/test_skill_renders.py
