- id: motion_preset
  tier: 2
  category: motion
  name: Motion preset (keyframes + easing)
  description: Pop-in, bounce, spring, slide, tilt or Ken Burns on a shot, with an easing curve (motion engine).
  synonyms:
    en: [pop in, bounce zoom, spring zoom, slide in, tilt in, ease in out]
    hinglish: [uchhal ke aaye, bounce wala zoom, spring jaisa]
    typos: [bounse zoom]
  params:
    preset: {type: enum, default: pop_in, choices: [pop_in, zoom_bounce, spring_zoom, slide_in_left, tilt_in, ken_burns]}
    easing: {type: enum, default: back, choices: [linear, ease_in, ease_out, ease_in_out, back, elastic, spring, bounce]}
    strength: {type: number, default: 1.0, min: 0.3, max: 2.0}
  time_modes: [between_times, at_moment, intermittent, segment]
  impl: {kind: effect, ref: keyframes, strength_param: strength}
  stage: geometry
  conflicts: []
  cost: cheap
  media3: "GlMatrixTransformation evaluating the same keyframes and easing per frame — NOT TESTED"
  licence: own code (engines/motion.py; FFmpeg zoompan/rotate expressions)
  preview: same at 360p
  examples: [pop in at 3s, bounce zoom on the drop, spring zoom here, slide in from the left at the start, uchhal ke aaye]
  status: tested
  test: tests/integration/test_skill_renders.py
