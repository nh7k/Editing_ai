contradictory:
  - {prompt: "music lagao aur music mat lagao", note: "must not crash; one of them, said back"}
  - {prompt: "zoom in and zoom out", note: "both are legal (the stack keeps the later)"}
  - {prompt: "black and white but keep only red", note: "color pop after B&W: the later wins, said back"}
  - {prompt: "slow motion aur 2x speed", note: "both legal; said back"}
  - {prompt: "captions lagao, captions mat lagao", note: "must not crash"}
